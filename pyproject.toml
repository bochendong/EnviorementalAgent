[project]
name = "worldseeds"
version = "0.2.0"
description = "World Seeds: an environment for networks of agents, with pluggable tasks (and agents kept apart in netagents)"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "rdkit>=2024.3"]

[project.optional-dependencies]
agents = ["openai-agents>=0.23", "openai>=3.0", "pydantic>=2.7"]

[tool.setuptools]
packages = ["worldseeds", "worldseeds.net", "worldseeds.net.providers", "worldseeds.codeworld",
            "netagents"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
