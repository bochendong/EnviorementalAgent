<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentCity Side by Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Two runs of the same problem, played round by round in step (web/codeworld.html embedded twice). */
:root {
  --night: #121925; --frame: #3a4a62; --frame-dark: #1f2a3a; --panel: #e8edf4; --panel-2: #cdd6e3;
  --ink: #1b2433; --ink-soft: #4f5d73; --accent: #4ab8ff;
  --left: #d24a3a; --right: #2f7fd0; --bound: #6b778a; --ref: #2f9e5a;
  --font-display: "Pixelify Sans", "Courier New", monospace; --font-text: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--night); color: #f4f8fc; font-family: var(--font-text); font-size: 19px; padding-inline: 16px; padding-block: 12px 24px; }
.wrap { max-width: 1600px; margin: 0 auto; display: grid; gap: 10px; }
h1 { font-family: var(--font-display); font-size: 30px; margin: 0; color: #e8f4ff; text-shadow: 3px 3px 0 #1f6fb0; }
.tag { margin: 2px 0 0; color: var(--panel-2); }
.panel { background: var(--panel); color: var(--ink); border: 4px solid var(--frame); border-radius: 6px; box-shadow: 0 4px 0 var(--frame-dark); padding: 10px 12px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; color: var(--frame-dark); text-transform: uppercase; letter-spacing: .5px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select { font-family: var(--font-display); font-size: 15px; color: var(--ink); background: var(--panel-2); border: 3px solid var(--frame); border-radius: 4px; padding: 3px 9px; box-shadow: 0 2px 0 var(--frame-dark); cursor: pointer; min-width: 0; }
button:hover { background: #f4f8fc; } button.on { background: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--frame); }
.round { font-family: var(--font-display); font-size: 18px; min-width: 120px; font-variant-numeric: tabular-nums; }
.panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.pane { padding: 0; overflow: hidden; }
.pane .head { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 10px; }
.pane .head select { width: 100%; }
.sw { width: 12px; height: 12px; border-radius: 2px; }
.pane iframe { display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; background: #000; }
.pane .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 10px; padding: 6px 10px 8px; font-variant-numeric: tabular-nums; }
.pane .stats b { font-family: var(--font-display); font-size: 17px; }
.pane .stats span { color: var(--ink-soft); font-size: 16px; }
.lower { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 900px) { .lower { grid-template-columns: minmax(0, 1fr); } }
#chart svg, #split svg { display: block; width: 100%; height: auto; }
.legend { color: var(--ink-soft); font-size: 16px; margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin: 0 4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AgentCity, side by side</h1>
    <p class="tag">Two teams on the same problem, in step: the same round on both sides.</p>
  </header>
  <div class="panel">
    <div class="bar">
      <button id="bFirst" aria-label="First round">|&lt;</button>
      <button id="bPrev" aria-label="Previous round">&lt;</button>
      <button id="bPlay">Play</button>
      <button id="bNext" aria-label="Next round">&gt;</button>
      <button id="bLast" aria-label="Last round">&gt;|</button>
      <select id="speed" aria-label="Speed">
        <option value="1">slow</option><option value="2" selected>normal</option><option value="5">fast</option>
      </select>
      <span class="round" id="round">round 0</span>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Round">
      <button id="bNet" class="on">Network</button>
      <button id="bSvg">Save chart (SVG)</button>
    </div>
  </div>
  <div class="panes">
    <div class="panel pane">
      <div class="head"><span class="sw" style="background:var(--left)"></span><select id="selL" aria-label="Left run"></select></div>
      <iframe id="fL" title="Left run"></iframe>
      <div class="stats" id="statsL"></div>
    </div>
    <div class="panel pane">
      <div class="head"><span class="sw" style="background:var(--right)"></span><select id="selR" aria-label="Right run"></select></div>
      <iframe id="fR" title="Right run"></iframe>
      <div class="stats" id="statsR"></div>
    </div>
  </div>
  <div class="lower">
    <div class="panel">
      <h2>Tasks done over rounds</h2>
      <div id="chart"></div>
      <div class="legend" id="chartLegend"></div>
    </div>
    <div class="panel">
      <h2>Where the actions went</h2>
      <div id="split"></div>
      <div class="legend">So far, every agent's actions: tasks (apply, hand in), talk (messages, inbox, store), waiting, other.</div>
    </div>
  </div>
</div>
<script src="compare.js"></script>
</body>
</html>
